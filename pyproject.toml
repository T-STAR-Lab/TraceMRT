[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracemrt"
version = "0.1.0"
description = "TraceMRT: SHADE-Arena and CUA-SHADE-Arena trajectory generation, optimization, and monitor evaluation."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }

# Keep this list focused on dependencies needed to run the public SHADE-Arena
# and CUA-SHADE-Arena workflows. Avoid adding notebook, GPU training, or
# unrelated analysis packages unless they are imported by the repository.
dependencies = [
    # Core config, typing, and runtime helpers
    "PyYAML>=6.0,<7",
    "pydantic[email]>=2.10,<3",
    "typing-extensions>=4.12",
    "python-dotenv>=1.0,<2",
    "simple-parsing>=0.1.6,<0.2",
    "docstring-parser>=0.16,<1",
    "rich>=13.9,<15",
    "tenacity>=8.5,<9",
    "httpx>=0.28,<1",
    "jsonlines>=4.0,<5",
    "jsonref>=1.1,<2",
    "openapi-pydantic>=0.5.1,<0.6",

    # LLM providers
    "openai>=2.0,<3",
    "anthropic>=0.79,<1",
    "tiktoken>=0.8,<1",
    "google-genai>=1.61,<2",

    # CUA-SHADE-Arena / Inspect AI
    "inspect-ai==0.3.179",

    # Metrics and lightweight analysis utilities
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<1",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.9,<1",
    "black>=24.10,<26",
    "pre-commit>=4,<5",
]

[tool.setuptools]
py-modules = [
    "add_monitor",
    "cal_metrics",
    "compute_auc",
    "run_cua",
    "run_shade",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "cua_shade_arena*",
    "cua_task_pairs*",
    "environment_classes*",
    "environments*",
    "llms*",
    "protocols*",
    "task_evaluation*",
    "task_pairs*",
    "tools*",
    "tracemrt*",
    "utils*",
]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.txt", "*.csv", "*.xlsx"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-include = ["*.ipynb"]
extend-exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "llm_response_cache",
    "cua_shade_arena/logs",
    "cua_shade_arena/run_inspect_*",
]
include = [
    "*.py",
    "run_shade.py",
    "run_cua.py",
    "add_monitor.py",
    "compute_auc.py",
    "cal_metrics.py",
    "cua_shade_arena/**/*.py",
    "cua_task_pairs/**/*.py",
    "environment_classes/**/*.py",
    "environments/**/*.py",
    "llms/**/*.py",
    "protocols/**/*.py",
    "task_evaluation/**/*.py",
    "task_pairs/**/*.py",
    "tools/**/*.py",
    "tracemrt/**/*.py",
    "utils/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # Long prompts and task strings are common in this repository.
]

[tool.black]
line-length = 120
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
  | llm_response_cache
  | cua_shade_arena/logs
  | cua_shade_arena/run_inspect_.*
)/
'''

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "integration: marks tests that require external services or Docker",
]
